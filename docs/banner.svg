<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Shuddh — The People's Lab">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#052e2b"/>
      <stop offset="0.55" stop-color="#0c4a6e"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.2" stop-color="#3b82f6"/>
      <stop offset="0.4" stop-color="#06b6d4"/>
      <stop offset="0.6" stop-color="#22c55e"/>
      <stop offset="0.8" stop-color="#eab308"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="milk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 70H1280M0 140H1280M0 210H1280M0 280H1280M0 350H1280"/>
    <path d="M160 0V420M320 0V420M480 0V420M640 0V420M800 0V420M960 0V420M1120 0V420"/>
  </g>
  <!-- phone with spectrum beam -->
  <circle cx="1030" cy="200" r="190" fill="url(#glow)"/>
  <g transform="translate(940 40)">
    <rect x="0" y="0" width="180" height="330" rx="28" fill="#0f172a" stroke="#94a3b8" stroke-width="3"/>
    <rect x="14" y="22" width="152" height="286" rx="16" fill="#111827"/>
    <circle cx="90" cy="12" r="4" fill="#475569"/>
    <!-- spectrograph on screen -->
    <rect x="26" y="40" width="128" height="10" rx="5" fill="url(#spec)"/>
    <path d="M26 150 C 50 110, 70 95, 90 100 S 130 120, 154 90" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <path d="M26 150 C 50 110, 70 95, 90 100 S 130 120, 154 90 L154 160 L26 160 Z" fill="url(#spec)" opacity="0.25"/>
    <!-- verdict ring -->
    <circle cx="90" cy="225" r="42" fill="none" stroke="#1f2937" stroke-width="10"/>
    <circle cx="90" cy="225" r="42" fill="none" stroke="#22c55e" stroke-width="10" stroke-linecap="round" stroke-dasharray="220 264" transform="rotate(-90 90 225)"/>
    <text x="90" y="232" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">87%</text>
    <text x="90" y="292" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#86efac">PURE MILK</text>
  </g>
  <!-- milk glass -->
  <g transform="translate(830 250)">
    <path d="M0 0 H70 L62 110 H8 Z" fill="none" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M3 28 H67 L62 108 H8 Z" fill="url(#milk)"/>
  </g>
  <!-- leaf -->
  <g transform="translate(1160 280) rotate(-25)">
    <path d="M0 0 C 40 -50, 90 -40, 100 0 C 90 40, 40 50, 0 0 Z" fill="#22c55e"/>
    <path d="M0 0 L100 0" stroke="#14532d" stroke-width="3"/>
  </g>
  <!-- title -->
  <text x="70" y="118" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#a7f3d0" letter-spacing="6">THE PEOPLE'S LAB</text>
  <text x="66" y="210" font-family="Helvetica, Arial, sans-serif" font-size="104" font-weight="900" fill="#ffffff">Shuddh</text>
  <rect x="70" y="232" width="380" height="8" rx="4" fill="url(#spec)"/>
  <text x="70" y="290" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#e0f2fe">Your phone's sensors check if food is safe —</text>
  <text x="70" y="330" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#e0f2fe">and help farmers grow it right.</text>
  <text x="70" y="380" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#93c5fd">On-device AI · works offline · no kits · honest confidence on every verdict</text>
</svg>
